name: ci

# Lint, type-check and fast unit tests only. Integration tests need Docker
# Postgres + dbt (see docs/BENCH_RUNBOOK.md) and are run locally; the workflow
# deliberately has no services, no secrets and no LLM calls.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Ruff (format)
        run: python -m ruff format --check .

      - name: mypy
        run: python -m mypy src

      - name: Unit tests
        run: python -m pytest -m "not integration"
