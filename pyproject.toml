[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqs"
version = "0.0.1"
description = "Agentic data-quality steward for batch pipelines on Postgres + dbt (deterministic detection, LLM only for reasoning)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shravan" }]
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "networkx>=3.2,<4",
    "sqlglot>=23.0,<30",
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "langgraph>=0.3,<2",
    "langchain>=0.3,<2",
    "langchain-core>=0.3,<2",
    "langchain-anthropic>=0.2,<2",
    "langchain-openai>=0.2,<2",
    "langgraph-checkpoint-sqlite>=2.0,<3",
    "PyGithub>=2.4,<3",
    "streamlit>=1.40,<2",
    "dbt-core>=1.8,<2",
    "dbt-postgres>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.2,<3",
    "types-PyYAML>=6,<8",
]

[project.scripts]
dqs = "dqs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "integration: needs Docker Postgres (dqs dev up first)",
    "llm: needs RUN_LLM_TESTS=1 and an API key (skipped otherwise)",
]
